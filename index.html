<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鳴潮圖鑑</title>
<meta name="theme-color" content="#7dd3fc">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/characters.css">
</head>
<body>

<header class="ww-header">
    <div class="ww-header-top">
        <div class="ww-title-block">
            <h1 data-i18n="site_title">鳴潮圖鑑</h1>
            <p class="ww-tagline" data-i18n="site_tagline">✦ 角色資料庫 ✦</p>
        </div>
        <div class="ww-header-controls">
            <button class="lang-pill active" data-lang="zh" onclick="applyLang('zh')">中文</button>
            <button class="lang-pill" data-lang="ja" onclick="applyLang('ja')">日本語</button>
            <button id="theme-toggle" class="theme-toggle-btn" onclick="toggleTheme()">🌙</button>
        </div>
    </div>
    <a class="back-to-main" href="https://hanabirn.github.io/" data-i18n="back_to_main">← 返回 Hanabiの小天地</a>
    <nav class="ww-nav">
        <button class="ww-nav-btn active" onclick="switchTab('characters', this)" data-i18n="nav_characters">角色圖鑑</button>
    </nav>
</header>

<main class="ww-main">

    <section id="page-characters" class="ww-page">
        <div class="ww-card">
            <h2 data-i18n="characters_title">✦ 角色圖鑑 ✦</h2>
            <div class="characters-toolbar">
                <input type="text" id="character-search-input" data-i18n-placeholder="search_placeholder" placeholder="搜尋角色名稱..." oninput="onCharacterSearchInput(this.value)">
                <select id="element-filter-select" onchange="onElementFilterChange(this.value)">
                    <option value="all" data-i18n="filter_all_element">全部屬性</option>
                </select>
                <select id="weapon-filter-select" onchange="onWeaponFilterChange(this.value)">
                    <option value="all" data-i18n="filter_all_weapon">全部武器</option>
                </select>
            </div>
            <p id="character-status" class="ww-status"></p>
            <div id="character-grid" class="character-grid"></div>
        </div>
    </section>

</main>

<div id="character-modal" class="modal-overlay" style="display:none;" onclick="closeCharacterModalOnOverlay(event)">
    <div class="modal-box">
        <div id="character-modal-body" class="character-modal-body"></div>
    </div>
</div>

<footer class="ww-footer">
    <p>鳴潮圖鑑 ✦ Wuthering Waves is a trademark of Kuro Games</p>
</footer>

<script src="js/theme.js"></script>
<script src="js/i18n.js"></script>
<script src="js/ww-data.js"></script>
<script src="js/characters.js"></script>
<script src="js/main.js"></script>
</body>
</html>
